<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Studio | DAP</title>
  <meta name="description" content="Accede a DAP Chat Studio para organizar, consultar y descargar tus conversaciones.">
  <link rel="icon" type="image/png" href="/assets/DAP_CHAT_STUDIO_ICONO_2.png">
  <style>
    :root { color-scheme: light; --dap-blue: #075985; }
    *, *::before, *::after { box-sizing: border-box; }
    html { height: 100%; }
    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f4f8fb;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .navbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      min-height: 76px;
      padding: 12px clamp(16px, 4vw, 64px);
      padding-top: max(12px, env(safe-area-inset-top));
      background: var(--dap-blue);
      border-bottom: 1px solid rgba(255, 255, 255, .16);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      max-width: 100%;
      color: #fff;
      text-decoration: none;
    }

    .brand-text {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      color: #fff;
    }
    .brand:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 5px;
      border-radius: 4px;
    }
    .chatstudio-viewer {
      display: flex;
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
    }
    .chatstudio-frame {
      display: block;
      flex: 1 1 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      border: 0;
      background: #fff;
    }
    @media (max-width: 600px) {
      .navbar { min-height: 68px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); }
      .brand { gap: 12px; }
      .brand-logo { width: 86px; height: 42px; }
      .brand-text { max-width: 210px; font-size: 12px; }
    }
    @media (max-width: 360px) {
      .brand-logo { width: 72px; }
      .brand-text { font-size: 11px; }
    }
  </style>
</head>
<body>
  <header class="navbar" id="navbar">
    <a href="https://www.dapanalytics.com/" class="brand" aria-label="Ir al inicio de DAP">
      <img class="brand-logo" src="/assets/Logo_DAP_verde-azul_blanco.png" alt="DAP">
      <span class="brand-text">Digitalización y Automatización de Procesos</span>
    </a>
  </header>
  <main class="chatstudio-viewer" aria-label="Aplicación DAP Chat Studio">
    <!-- URL publicada de Chat Studio tomada del enlace de la página de inicio. -->
    <iframe
      class="chatstudio-frame"
      src="https://script.google.com/macros/s/AKfycbxl_iD8pr1LnBLUGW3qkp96GSmsCyZ6O-0jHyVlxBysPJ5iaDUEweqbTfPRXv1LLyMO/exec"
      title="DAP Chat Studio"
      allow="fullscreen"
      allowfullscreen>
    </iframe>
  </main>
</body>
</html>
